version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth Service ─────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - '${AUTH_PORT:-3001}:3001'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - AUTH_PORT=3001
      - AUTH_MONGO_URI=${AUTH_MONGO_URI:-mongodb://mongodb:27017/auth-db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - THROTTLE_TTL=${THROTTLE_TTL:-60}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-30}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  # ── API Service ──────────────────────────────────
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: api-service
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_PORT=3000
      - API_MONGO_URI=${API_MONGO_URI:-mongodb://mongodb:27017/api-db}
      - JWT_SECRET=${JWT_SECRET}
      - THROTTLE_TTL=${THROTTLE_TTL:-60}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-30}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - app-net
    restart: unless-stopped
    depends_on:
      - api-service
      - auth-service

  # ── Grafana ──────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - '3003:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/provisioning/dashboards/api-dashboard.json:/var/lib/grafana/dashboards/api-dashboard.json:ro
    networks:
      - app-net
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  mongo_data:
  grafana_data:

networks:
  app-net:
    driver: bridge
