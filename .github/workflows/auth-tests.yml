name: Auth service regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
